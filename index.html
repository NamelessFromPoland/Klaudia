<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prezentacja PDF</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}
	body {
		background: #18191d;
		font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		color: white;
		display: flex;
		flex-direction: column;
	}
	header {
		height: 56px;
		flex: 0 0 56px;
		display: flex;
		align-items: center;
		padding: 0 18px;
		background: #22242a;
		border-bottom: 1px solid #353840;
	}
	header strong {
		font-size: 16px;
	}
	main {
		flex: 1;
		min-height: 0;
		padding: 10px;
	}
	iframe {
		display: block;
		width: 100%;
		height: 100%;
		border: 0;
		background: white;
		border-radius: 4px;
	}
</style>
</head>
<body>
	<header>
		<strong>Prezentacja</strong>
	</header>

	<main>
		<iframe
			src="prezentacja.pdf"
			title="Prezentacja PDF">
		</iframe>
	</main>
</body>
</html>
